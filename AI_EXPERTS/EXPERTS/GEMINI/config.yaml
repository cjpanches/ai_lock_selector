# Expert Configuration
expert:
  name: "GEMINI"
  full_name: "GEMINI_ML_EXPERT"
  version: "1.0.0"
  role: "ML/CV Engineering"
  description: "Машинное обучение и компьютерное зрение"

api:
  provider: "google"
  env_var: "GEMINI_API_KEY"
  model: "gemini-pro"

capabilities:
  - ml_model_design
  - cv_optimization
  - dataset_curation

files:
  input: "01_input_data.txt"
  super_prompt: "00_super_prompt.txt"
  methodology: "02_methodology.txt"
  results: "03_analysis_results.txt"

constraints:
  max_file_size: "100KB"
  timeout_seconds: 300

dependencies:
  - grok
