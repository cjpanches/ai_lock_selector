version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ailock_postgres
    environment:
      POSTGRES_USER: ailock
      POSTGRES_PASSWORD: ailock_password
      POSTGRES_DB: ailock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ailock:ailock_password@postgres:5432/ailock_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
